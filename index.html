<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProStore - Tu Tienda Digital Premier</title>
<style>
:root {
  --pk: #ec4899;
  --pk-hover: #db2777;
  --pu: #8b5cf6;
  --pu-dark: #6d28d9;
  --bg: #f8fafc;
  --bg-card: rgba(255, 255, 255, 0.85);
  --bg-modal: #ffffff;
  --tx: #0f172a;
  --tx-mut: #64748b;
  --border: #e2e8f0;
  --g: linear-gradient(135deg, #ec4899, #8b5cf6);
  --g-subtle: linear-gradient(135deg, rgba(236, 72, 153, 0.08), rgba(139, 92, 246, 0.08));
  --glass: rgba(255, 255, 255, 0.75);
  --glass-border: rgba(255, 255, 255, 0.9);
  --shadow-sm: 0 1px 4px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 6px 18px -4px rgba(139, 92, 246, 0.12), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 12px 24px -8px rgba(15, 23, 42, 0.15);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
}

[data-theme="dark"] {
  --bg: #0b0f17;
  --bg-card: rgba(23, 32, 51, 0.8);
  --bg-modal: #131c2e;
  --tx: #f1f5f9;
  --tx-mut: #94a3b8;
  --border: #1e293b;
  --glass: rgba(19, 28, 46, 0.75);
  --glass-border: rgba(255, 255, 255, 0.1);
  --shadow-md: 0 6px 18px -4px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 12px 24px -8px rgba(0, 0, 0, 0.7);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--tx);
  min-height: 100vh;
  padding-bottom: 56px;
  overflow-x: hidden;
  transition: background 0.3s ease, color 0.3s ease;
  font-size: 13px;
}

/* Background animated gradients */
.blob-container { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: -1; }
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.35;
  animation: float 16s ease-in-out infinite;
}
.b1 { width: 240px; height: 240px; background: var(--pk); top: -60px; left: -60px; }
.b2 { width: 260px; height: 260px; background: var(--pu); bottom: -80px; right: -80px; animation-delay: -8s; }
.b3 { width: 180px; height: 180px; background: #3b82f6; top: 40%; left: 60%; animation-delay: -4s; }
@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(25px, 30px) scale(1.08); }
}

@keyframes float-aurora {
  0% { transform: translate(0, 0) rotate(0deg) scale(1); }
  33% { transform: translate(30px, -20px) rotate(120deg) scale(1.1); }
  66% { transform: translate(-20px, 25px) rotate(240deg) scale(0.95); }
  100% { transform: translate(0, 0) rotate(360deg) scale(1); }
}

@keyframes shimmer-wave {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes heart-sparkle {
  0% { transform: scale(1); }
  30% { transform: scale(1.4) rotate(-10deg); }
  60% { transform: scale(0.85) rotate(10deg); }
  100% { transform: scale(1) rotate(0); }
}

@keyframes chip-glow {
  0%, 100% { box-shadow: 0 2px 8px rgba(236, 72, 153, 0.3); }
  50% { box-shadow: 0 4px 16px rgba(139, 92, 246, 0.6); }
}

@keyframes tag-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.06); opacity: 0.9; }
}

@keyframes sheet-spring {
  0% { transform: translateY(100%); }
  70% { transform: translateY(-8px); }
  100% { transform: translateY(0); }
}

@keyframes badge-bounce {
  0% { transform: scale(1); }
  40% { transform: scale(1.4); }
  70% { transform: scale(0.85); }
  100% { transform: scale(1); }
}

@keyframes toast-slide {
  0% { transform: translate(-50%, 100px); opacity: 0; }
  70% { transform: translate(-50%, -6px); opacity: 1; }
  100% { transform: translate(-50%, 0); opacity: 1; }
}

@keyframes ticker-slide {
  0% { transform: translateX(100%); }
  100% { transform: translateX(-100%); }
}

/* Glassmorphism utility */
.glass {
  background: var(--glass);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-md);
}

/* Header */
header {
  position: sticky;
  top: 0;
  z-index: 30;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}
.brand {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  text-decoration: none;
}
.brand-logo {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  background: var(--g);
  display: grid;
  place-items: center;
  color: white;
  box-shadow: 0 2px 8px rgba(236, 72, 153, 0.35);
}
.brand-logo svg { width: 16px; height: 16px; }
.brand-title {
  margin: 0;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.4px;
  background: var(--g);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.nav-actions { display: flex; align-items: center; gap: 6px; }

/* Icon Buttons */
.ib {
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--tx);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.ib svg { width: 16px; height: 16px; }
.ib:hover { transform: translateY(-1px); border-color: var(--pu); color: var(--pu); }
.ib:active { transform: scale(0.92); }
.badge {
  position: absolute;
  top: -3px;
  right: -3px;
  background: var(--g);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  min-width: 14px;
  height: 14px;
  padding: 0 3px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  box-shadow: 0 2px 5px rgba(236, 72, 153, 0.4);
}
.pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes pop { 50% { transform: scale(1.3); } }

/* Main Container */
main { max-width: 1000px; margin: 0 auto; padding: 10px 10px; }

/* Hero Banner */
.hero-banner {
  border-radius: var(--radius-lg);
  padding: 12px 14px;
  margin-bottom: 12px;
  background: var(--g-subtle);
  border: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  position: relative;
  overflow: hidden;
}
.hero-content { max-width: 100%; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 12px;
  background: var(--g);
  color: white;
  font-size: 10px;
  font-weight: 700;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.hero-tag svg { width: 12px; height: 12px; }
.hero-title { font-size: 15px; font-weight: 800; margin: 0 0 4px; line-height: 1.25; }
.hero-desc { color: var(--tx-mut); margin: 0; font-size: 11px; line-height: 1.35; }

/* Search and Filters Bar */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
  align-items: center;
}
.search-wrapper {
  flex: 1;
  min-width: 160px;
  position: relative;
  display: flex;
  align-items: center;
}
.search-wrapper .search-icon {
  position: absolute;
  left: 10px;
  color: var(--tx-mut);
  pointer-events: none;
  display: flex;
}
.search-wrapper .search-icon svg { width: 14px; height: 14px; }
.search-input {
  width: 100%;
  padding: 7px 10px 7px 32px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--tx);
  outline: none;
  font-size: 12px;
  transition: all 0.2s;
}
.search-input:focus {
  border-color: var(--pu);
  box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.15);
}

.select-custom {
  padding: 7px 10px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--tx);
  outline: none;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.select-custom:focus { border-color: var(--pu); }

/* Category Chips */
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 10px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  border: 1px solid var(--border);
  padding: 5px 12px;
  border-radius: 14px;
  background: var(--bg-card);
  color: var(--tx-mut);
  cursor: pointer;
  white-space: nowrap;
  font-size: 11px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.chip svg { width: 12px; height: 12px; }
.chip:hover { border-color: var(--pu); color: var(--tx); }
.chip.on {
  background: var(--g);
  color: #fff;
  border-color: transparent;
  animation: chip-glow 3s infinite ease-in-out;
}

/* Product Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
@media (min-width: 640px) {
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 14px;
  }
}

@keyframes aurora-pulse {
  0% {
    box-shadow: 0 0 10px rgba(236, 72, 153, 0.2), 0 0 20px rgba(139, 92, 246, 0.15), inset 0 0 15px rgba(236, 72, 153, 0.05);
    border-color: rgba(236, 72, 153, 0.35);
  }
  33% {
    box-shadow: 0 0 18px rgba(139, 92, 246, 0.35), 0 0 28px rgba(59, 130, 246, 0.25), inset 0 0 20px rgba(139, 92, 246, 0.1);
    border-color: rgba(139, 92, 246, 0.55);
  }
  66% {
    box-shadow: 0 0 14px rgba(16, 185, 129, 0.3), 0 0 22px rgba(236, 72, 153, 0.2), inset 0 0 15px rgba(16, 185, 129, 0.08);
    border-color: rgba(16, 185, 129, 0.45);
  }
  100% {
    box-shadow: 0 0 10px rgba(236, 72, 153, 0.2), 0 0 20px rgba(139, 92, 246, 0.15), inset 0 0 15px rgba(236, 72, 153, 0.05);
    border-color: rgba(236, 72, 153, 0.35);
  }
}

.card {
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--bg-card);
  border: 1px solid var(--border);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  position: relative;
  cursor: pointer;
  animation: aurora-pulse 4s ease-in-out infinite;
}
.card:hover {
  transform: translateY(-5px) scale(1.02);
  box-shadow: 0 12px 28px -4px rgba(236, 72, 153, 0.35), 0 0 20px rgba(139, 92, 246, 0.3);
  border-color: rgba(236, 72, 153, 0.8);
}
.card .im {
  aspect-ratio: 1;
  background: var(--bg-modal) center/cover no-repeat;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card .im img, .card .im svg {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}
.card:hover .im img, .card:hover .im svg { transform: scale(1.05); }
.card .info { padding: 8px; flex: 1; display: flex; flex-direction: column; }
.card .cat-tag { font-size: 9px; font-weight: 700; color: var(--pu); text-transform: uppercase; margin-bottom: 2px; }
.card b { font-size: 12px; font-weight: 700; color: var(--tx); line-height: 1.25; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .rating-row { display: flex; align-items: center; gap: 3px; font-size: 10px; color: var(--warning); margin-bottom: 6px; }
.card .rating-row svg { width: 11px; height: 11px; }
.card .price-row { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.price { font-weight: 800; font-size: 14px; background: var(--g); -webkit-background-clip: text; background-clip: text; color: transparent; }
.heart {
  position: absolute;
  top: 6px;
  right: 6px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(4px);
  border: 0;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  color: #64748b;
  transition: all 0.2s;
  z-index: 5;
}
.heart svg { width: 14px; height: 14px; }
.heart.active { color: var(--pk); }
.heart:hover { transform: scale(1.1); }
.tag {
  position: absolute;
  left: 6px;
  top: 6px;
  background: var(--g);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
  z-index: 5;
  animation: tag-pulse 2.5s infinite ease-in-out;
}

/* Modals & Overlays */
.ov {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 50;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.ov.show { display: flex; animation: fadeIn 0.2s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.sheet {
  width: 100%;
  max-width: 500px;
  max-height: 88vh;
  overflow-y: auto;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  background: var(--bg-modal);
  border: 1px solid var(--border);
  padding: 0 0 16px;
  animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-lg);
  color: var(--tx);
}
@media (min-width: 640px) {
  .ov { align-items: center; padding: 16px; }
  .sheet { border-radius: var(--radius-lg); max-height: 82vh; }
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.sheet-header {
  position: sticky;
  top: 0;
  background: var(--bg-modal);
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
}
.sheet-title { font-size: 14px; font-weight: 700; margin: 0; }
.pad { padding: 14px; }

/* Buttons */
.btn {
  border: 0;
  font-family: inherit;
  font-weight: 700;
  font-size: 13px;
  color: #fff;
  background: var(--g);
  padding: 10px 14px;
  border-radius: var(--radius-md);
  cursor: pointer;
  width: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 3px 10px rgba(236, 72, 153, 0.28);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  text-decoration: none;
}
.btn svg { width: 16px; height: 16px; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(236, 72, 153, 0.38); }
.btn:active { transform: scale(0.97); }
.btn.sec {
  background: var(--bg-card);
  color: var(--tx);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.btn.sec:hover { border-color: var(--pu); color: var(--pu); }
.btn.sm { width: auto; padding: 6px 10px; font-size: 11px; border-radius: var(--radius-sm); }
.btn.sm svg { width: 13px; height: 13px; }
.btn.danger { background: #ef4444; box-shadow: 0 3px 10px rgba(239, 68, 68, 0.25); }

/* Accordion & Form Controls */
.acc {
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  margin-top: 10px;
  overflow: hidden;
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: var(--shadow-sm);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.acc:hover {
  border-color: rgba(139, 92, 246, 0.35);
  box-shadow: var(--shadow-md);
}
.acc.open {
  border-color: rgba(139, 92, 246, 0.5);
  box-shadow: var(--shadow-md);
  background: var(--glass);
}
.acc > button {
  width: 100%;
  border: 0;
  background: transparent;
  font: inherit;
  font-weight: 700;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  color: var(--tx);
  font-size: 12px;
  gap: 8px;
  transition: color 0.2s ease, background 0.2s ease;
  user-select: none;
}
.acc > button:hover {
  color: var(--pu);
  background: var(--g-subtle);
}
.acc .body {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), padding 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
  padding: 0 14px;
}
.acc.open .body {
  max-height: 1200px;
  opacity: 1;
  padding: 4px 14px 14px;
}
.acc .arrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  color: var(--pu);
  font-weight: 700;
}
.acc.open .arrow { transform: rotate(180deg); }

label { font-size: 11px; font-weight: 600; color: var(--tx-mut); display: block; margin: 8px 0 4px; }
input, select, textarea {
  font: inherit;
  width: 100%;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--tx);
  outline: none;
  font-size: 12px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--pu);
  box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.15);
}

/* Rows & Flex items */
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; }
.row + .row { border-top: 1px dashed var(--border); }

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 68px;
  transform: translate(-50%, 100px);
  background: #0f172a;
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  z-index: 100;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: var(--shadow-lg);
  transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: none;
}
.toast.show { transform: translate(-50%, 0); }
.toast svg { width: 14px; height: 14px; }

/* Mobile Bottom Navigation Bar */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 52px;
  background: var(--glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 40;
}
.bnav-btn {
  border: 0;
  background: transparent;
  color: var(--tx-mut);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 8px;
  transition: all 0.2s;
  position: relative;
}
.bnav-btn svg { width: 18px; height: 18px; }
.bnav-btn.active, .bnav-btn:hover { color: var(--pu); }

/* Admin Grid Cards */
.admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin-bottom: 14px; }
.stat-card {
  padding: 10px;
  border-radius: var(--radius-md);
  background: var(--g-subtle);
  border: 1px solid var(--border);
  text-align: center;
}
.stat-card .val { font-size: 16px; font-weight: 800; color: var(--pu); }
.stat-card .lbl { font-size: 10px; color: var(--tx-mut); font-weight: 600; }

.empty { text-align: center; color: var(--tx-mut); padding: 30px 14px; font-weight: 500; font-size: 12px; }
</style>
</head>
<body>

<div class="blob-container">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<header class="glass">
  <a class="brand" onclick="navigateTo('home')">
    <div class="brand-logo" id="headerLogo"></div>

  else inner += `<path d="M130 150 L270 150 L250 270 L150 270 Z" fill="white"/><circle cx="200" cy="150" r="30" fill="#fef08a"/>`;

  const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${colorA}"/><stop offset="100%" stop-color="${colorB}"/></linearGradient></defs><rect width="400" height="400" fill="url(#g)"/>${inner}</svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svgStr);
}

  const curr = CURRENCIES[selectedCurrency] || CURRENCIES.ARS;

};

/* Q&A module for products */
function submitQuestion(prodId) {

  openP(prodId);

/* Flash Sales Countdown Timer */
let flashSaleEndTime = Date.now() + 1000 * 60 * 60 * 5; // 5 hours countdown
function startFlashSaleTimer() {
  const el = $('flashTimer');
  if(!el) return;
  setInterval(() => {
    const diff = Math.max(0, flashSaleEndTime - Date.now());
    const h = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, '0');
    const m = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
    const s = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
    el.textContent = `${h}:${m}:${s}`;
  }, 1000);
}

function exportOrdersCSV() {
  if(!S.orders || S.orders.length === 0) return toast('No hay pedidos para exportar');
  let csv = 'ID,Fecha,Cliente,Telefono,Total,Estado\n';
  S.orders.forEach(o => {
    csv += `"${o.id}","${o.date}","${o.customer?.name || ''}","${o.customer?.phone || ''}","${o.total}","${o.status}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pedidos-prostore.csv';
  a.click();
  toast('Reporte CSV descargado 📊');
}

function navigateTo(page) {
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  if(page === 'home') {
    $('navHome').classList.add('active');
    currentCat = 'Todos';
    render();
  } else if(page === 'favs') {
    $('navFavs').classList.add('active');
    currentCat = '❤️ Favoritos';
    render();
  }
}

function render() {
  $('sn').textContent = S.cfg.name;
  document.title = S.cfg.name;

  // Categories
  const cats = ['Todos', '❤️ Favoritos', ...new Set(S.prods.map(p => p.cat).filter(Boolean))];
  $('chips').innerHTML = cats.map(c => `
    <button class="chip ${c === currentCat ? 'on' : ''}" onclick="currentCat='${c}'; render()">
      ${c === '❤️ Favoritos' ? ICONS.heartFilled : ''} ${esc(c)}
    </button>
  `).join('');

  if($('favActions')) {
    $('favActions').style.display = (currentCat === '❤️ Favoritos' && fav.length > 0) ? 'flex' : 'none';
  }

  // Filter & Search
  const query = $('q').value.toLowerCase().trim();
  const minP = +$('p_min').value || 0;
  const maxP = +$('p_max').value || Infinity;
  const stkOnly = $('stk_only').checked;

  let list = S.prods.filter(p => {
    const matchCat = (currentCat === 'Todos') || (currentCat === '❤️ Favoritos' ? fav.includes(p.id) : p.cat === currentCat);
    const matchSearch = p.name.toLowerCase().includes(query) || (p.desc && p.desc.toLowerCase().includes(query));
    const matchPrice = p.price >= minP && p.price <= maxP;
    const matchStock = stkOnly ? p.stock > 0 : true;
    const matchRating = (p.rating || 5.0) >= minRatingFilter;
    return matchCat && matchSearch && matchPrice && matchStock && matchRating;
  });

  // Sort
  const ord = $('ord').value;
  if(ord === 'a') list.sort((a, b) => a.price - b.price);
  if(ord === 'd') list.sort((a, b) => b.price - a.price);
  if(ord === 'r') list.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  if(ord === 'az') list.sort((a, b) => a.name.localeCompare(b.name));
  if(ord === 'za') list.sort((a, b) => b.name.localeCompare(a.name));
  if(ord === 'disc') list.sort((a, b) => ((b.oldPrice ? (b.oldPrice - b.price)/b.oldPrice : 0) - (a.oldPrice ? (a.oldPrice - a.price)/a.oldPrice : 0)));
  if(ord === 'new') list.sort((a, b) => b.id - a.id);

  // Render Grid
  const grid = $('grid');
  if(list.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column: 1/-1;">No se encontraron productos en esta categoría ✨</div>`;
  } else {
    grid.innerHTML = list.map(p => {
      const isFav = fav.includes(p.id);
      const discountPct = (p.oldPrice && p.oldPrice > p.price) ? Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100) : 0;
      const isLowStock = p.stock > 0 && p.stock <= 3;

      return `
        <div class="card glass" onclick="openP(${p.id})">
          <div class="im" style="background-image: url('${p.img}')">
            ${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ''}
            ${discountPct > 0 ? `<span class="tag" style="top:28px; background:#ef4444;">-${discountPct}% OFF</span>` : ''}
            ${isLowStock ? `<span class="tag" style="top:${discountPct > 0 ? '50px' : '28px'}; background:#f59e0b;">Últimas ${p.stock} un.</span>` : ''}
            <button class="heart ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav(${p.id})">
              ${isFav ? ICONS.heartFilled : ICONS.heart}
            </button>
          </div>
          <div class="info">
            <span class="cat-tag">${esc(p.cat || 'General')}</span>
            <b>${esc(p.name)}</b>
            <div class="rating-row">
              ${ICONS.star} <span>${p.rating || 5.0} (${(p.reviews || []).length})</span>
            </div>
            <div class="price-row">
              <div>
                <span class="price">${fmt(p.price)}</span>
                ${p.oldPrice ? `<div style="font-size:10px; color:var(--tx-mut); text-decoration:line-through;">${fmt(p.oldPrice)}</div>` : ''}
              </div>
              <button class="ib" style="width:28px; height:28px;" onclick="event.stopPropagation(); addCart(${p.id})">
                ${ICONS.plus}
              </button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  // Footer Contact
  const c = S.cfg;
  const ph = (c.whats || c.phone).replace(/\D/g, '');
  $('ct').innerHTML = [
    c.phone && `<a class="btn sec sm" href="tel:${c.phone}">${ICONS.phone} Llama</a>`,
    ph && `<a class="btn sec sm" href="https://wa.me/${ph}" target="_blank">${ICONS.whatsapp} WhatsApp</a>`,
    c.insta && `<a class="btn sec sm" href="https://instagram.com/${c.insta.replace('@','')}" target="_blank">${ICONS.instagram} Instagram</a>`,
    c.fb && `<a class="btn sec sm" href="https://facebook.com/${c.fb}" target="_blank">${ICONS.facebook} Facebook</a>`
  ].filter(Boolean).join('');

  // Render Recently Viewed
  renderRecent();

  // Cart & Compare Badges and Page Title Counter
  const count = cart.reduce((s, i) => s + i.q, 0);
  const cb = $('cb');
  if(cb) cb.textContent = count;
  const compCount = $('compCount');
  if(compCount) compCount.textContent = compareList.length;

  document.title = count > 0 ? `(${count}) ${S.cfg.name}` : S.cfg.name;

  // Floating WhatsApp link update
  const floatWa = $('floatWhatsappBtn');
  if(floatWa) {
    const ph = (S.cfg.whats || S.cfg.phone).replace(/\D/g, '');
    floatWa.href = `https://wa.me/${ph}?text=${encodeURIComponent('Hola, quisiera consultar sobre la tienda ' + S.cfg.name)}`;
  }
}

  // Add to recently viewed
  recentProds = [id, ...recentProds.filter(x => x !== id)].slice(0, 6);
  save();
  renderRecent();

  // Deep Link update hash
  window.location.hash = `prod-${id}`;
  const c = S.cfg;
  const cuotas = Math.min(p.cuotas || 1, c.maxCuotas || 12);

function calcShipping(price) {
  const cp = $('cp_ship').value.trim();
  const res = $('cp_res');
  if(!cp) return toast('Ingresa un código postal');
  const freeMin = S.cfg.freeShipMin || 50000;
  if(price >= freeMin) {
    res.innerHTML = `<span style="color:var(--success); font-weight:700;">¡Envío GRATIS a C.P. ${esc(cp)}! (Llega en 24-48 hs)</span>`;
  } else {
    const cost = 2800;
    res.innerHTML = `<span style="color:var(--tx); font-weight:600;">Coste estimado a C.P. ${esc(cp)}: <b>${fmt(cost)}</b> (Llega en 2-4 días hábiles)</span>`;
  }
}

function shareProd(title) {
  if (navigator.share) {
    navigator.share({ title: title, url: window.location.href });
  } else {
    navigator.clipboard.writeText(window.location.href);
    toast('Enlace copiado al portapapeles');
  }
}

function addReview(id) {
  const p = S.prods.find(x => x.id === id);
  const name = $('rev_name').value.trim();
  const comm = $('rev_comm').value.trim();
  const rating = +$('rev_stars').value;

  if(!name || !comm) return toast('Completa nombre y comentario');
  if(!p.reviews) p.reviews = [];
  p.reviews.push({ name, rating, comment: comm });

  // Recalculate rating
  p.rating = +(p.reviews.reduce((s, r) => s + r.rating, 0) / p.reviews.length).toFixed(1);
  save();
  render();
  openP(id);
  toast('¡Gracias por tu opinión!');
}

/* ==========================================================================
   CART ENGINE & COUPONS
   ========================================================================== */
function addCart(id) {
  const p = S.prods.find(x => x.id === id);
  if(!p || p.stock <= 0) return toast('Producto sin stock disponible');

  const item = cart.find(x => x.id === id);
  if(item) {
    if(item.q >= p.stock) return toast('Alcanzaste el límite de stock');
    item.q++;
  } else {
    cart.push({ id, q: 1 });
  }

  save();
  render();
  const cb = $('cb');
  cb.classList.remove('pop');
  void cb.offsetWidth;
  cb.classList.add('pop');
  toast('Agregado al carrito 🛍️');
}

function updateCartQty(id, delta) {
  const item = cart.find(x => x.id === id);
  if(!item) return;
  const p = S.prods.find(x => x.id === id);

  item.q += delta;
  if(item.q <= 0) {
    cart = cart.filter(x => x.id !== id);
  } else if(p && item.q > p.stock) {
    item.q = p.stock;
    toast('Stock máximo alcanzado');
  }
  save();
  render();
  openCart();
}

function clearCart() {
  if(confirm('¿Seguro que deseas vaciar el carrito?')) {
    cart = [];
    activeCoupon = null;
    save();
    render();
    openCart();
    toast('Carrito vaciado');
  }
}

function openCart() {
  const items = cart.map(c => ({ ...S.prods.find(p => p.id === c.id), q: c.q })).filter(x => x.id);
  const subtotal = items.reduce((s, i) => s + i.price * i.q, 0);

  let discount = 0;
  if(activeCoupon) {
    if(activeCoupon.type === 'percent') discount = (subtotal * activeCoupon.discount) / 100;
    else discount = activeCoupon.discount;
  }
  const total = Math.max(0, subtotal - discount);
  const freeShipMin = S.cfg.freeShipMin || 50000;
  const progressPercent = Math.min(100, (subtotal / freeShipMin) * 100);

  showOv(`
    <div class="sheet-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <h3 class="sheet-title">Tu Carrito (${items.reduce((s,i)=>s+i.q,0)})</h3>
        ${items.length ? `<button class="btn danger sm" style="padding:2px 6px; font-size:10px;" onclick="clearCart()">Vaciar</button>` : ''}
      </div>
      <button class="ib" onclick="closeOv()">${ICONS.close}</button>
    </div>
    <div class="pad">
      <!-- Free Shipping Indicator -->
      <div style="background:var(--g-subtle); padding:12px; border-radius:var(--radius-md); margin-bottom:16px;">
        <div style="font-size:12px; font-weight:700; display:flex; justify-content:space-between; margin-bottom:6px;">
          <span>${subtotal >= freeShipMin ? '🎉 ¡Envío gratis alcanzado!' : `Te faltan ${fmt(freeShipMin - subtotal)} para envío gratis`}</span>
          <span>${Math.round(progressPercent)}%</span>
        </div>
        <div style="height:6px; background:var(--border); border-radius:3px; overflow:hidden;">
          <div style="width:${progressPercent}%; height:100%; background:var(--g); transition:width 0.3s;"></div>
        </div>
      </div>

      <!-- Items List -->
      ${items.map(i => `
        <div class="row">
          <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:48px; height:48px; border-radius:var(--radius-sm); background:url('${i.img}') center/cover; flex-shrink:0;"></div>
            <div>
              <div style="font-weight:700; font-size:14px;">${esc(i.name)}</div>
              <div style="font-size:13px; color:var(--tx-mut);">${fmt(i.price)}</div>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <button class="ib" style="width:28px; height:28px;" onclick="updateCartQty(${i.id}, -1)">${ICONS.minus}</button>
            <span style="font-weight:700; font-size:14px; min-width:18px; text-align:center;">${i.q}</span>
            <button class="ib" style="width:28px; height:28px;" onclick="updateCartQty(${i.id}, 1)">${ICONS.plus}</button>
          </div>
        </div>
      `).join('') || '<div class="empty">Tu carrito está vacío</div>'}

      ${items.length ? `
        <!-- Coupon Section -->
        <div style="display:flex; gap:8px; margin:16px 0;">
          <input id="cp_code" placeholder="Código de cupón (ej: PROMO10)" style="text-transform:uppercase;">
          <button class="btn sec sm" onclick="applyCoupon()">Aplicar</button>
        </div>
        ${activeCoupon ? `
          <div style="font-size:12px; color:var(--success); font-weight:700; margin-bottom:12px; display:flex; justify-content:space-between;">
            <span>Cupón ${activeCoupon.code} aplicado</span>
            <span style="cursor:pointer;" onclick="activeCoupon=null; openCart();">Quitar ✕</span>
          </div>
        ` : ''}

        <div style="border-top:1px dashed var(--border); padding-top:12px; margin-top:12px;">
          <div class="row"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
          ${discount > 0 ? `<div class="row" style="color:var(--success)"><span>Descuento</span><span>-${fmt(discount)}</span></div>` : ''}
          <div class="row" style="font-size:18px; font-weight:800;">
            <span>Total</span>
            <span class="price">${fmt(total)}</span>
          </div>
        </div>

        <button class="btn" style="margin-top:16px;" onclick="openCheckout()">${ICONS.truck} Iniciar Checkout</button>
      ` : ''}
    </div>
  `);
}

function applyCoupon() {
  const code = $('cp_code').value.trim().toUpperCase();
  const found = S.coupons.find(c => c.code === code && c.active);
  if(found) {
    activeCoupon = found;
    toast(`Cupón ${code} aplicado exitosamente! 🎉`);
    openCart();
  } else {
    toast('Cupón inválido o expirado');
  }
}

function openCheckout() {

  const subtotal = items.reduce((s, i) => s + i.price * i.q, 0);
  let discount = 0;
  if(activeCoupon) {
    discount = activeCoupon.type === 'percent' ? (subtotal * activeCoupon.discount) / 100 : activeCoupon.discount;
  }
  const total = Math.max(0, subtotal - discount);

  showOv(`
    <div class="sheet-header">
      <h3 class="sheet-title">Finalizar Compra</h3>
      <button class="ib" onclick="closeOv()">${ICONS.close}</button>
    </div>

      <h4 style="margin:16px 0 10px;">2. Método de Pago</h4>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn sec" onclick="processCheckout('whatsapp', ${total})">
          ${ICONS.whatsapp} Enviar Pedido por WhatsApp
        </button>
        <button class="btn sec" onclick="processCheckout('transfer', ${total})">
          ${ICONS.creditCard} Transferencia Bancaria / CBU
        </button>
        ${S.cfg.mpLink ? `
          <button class="btn sec" onclick="processCheckout('mp', ${total})">
            💳 Pagar con Mercado Pago
          </button>
        ` : ''}
      </div>
    </div>
  `);
}

function processCheckout(method, total) {
  const name = $('chk_name').value.trim();
  const phone = $('chk_phone').value.trim();
  const addr = $('chk_addr').value.trim();
  const notes = $('chk_notes') ? $('chk_notes').value.trim() : '';

  if(!name || !phone) return toast('Por favor completa nombre y teléfono');

  const items = cart.map(c => ({ ...S.prods.find(p => p.id === c.id), q: c.q }));
  const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
  const orderData = {
    id: orderId,
    date: new Date().toLocaleDateString('es-AR') + ' ' + new Date().toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'}),
    customer: { name, phone, addr, notes },
    items,
    total,
    status: 'Pendiente',
    method
  };

  // Deduct stock
  items.forEach(it => {
    const p = S.prods.find(x => x.id === it.id);
    if(p) p.stock = Math.max(0, p.stock - it.q);
  });

  S.orders.unshift(orderData);
  cart = [];
  activeCoupon = null;
  save();
  render();

  if(method === 'whatsapp') {
    const text = `🛍️ *NUEVO PEDIDO DE TIENDA* (#${orderId})\n` +
      `👤 *Cliente:* ${name}\n` +
      `📞 *Teléfono:* ${phone}\n` +
      `📍 *Dirección:* ${addr || 'Retiro en local'}\n` +
      (notes ? `📝 *Notas:* ${notes}\n` : '') + `\n` +
      `📦 *Productos:*\n` + items.map(i => `• ${i.name} ×${i.q} (${fmt(i.price * i.q)})`).join('\n') + `\n\n` +
      `💰 *Total a Pagar:* ${fmt(total)}`;

    const ph = (S.cfg.whats || S.cfg.phone).replace(/\D/g, '');
    window.open(`https://wa.me/${ph}?text=${encodeURIComponent(text)}`, '_blank');
    showOrderSuccess(orderId, total);
  } else if(method === 'transfer') {
    showTransferModal(orderId, total);
  } else if(method === 'mp') {
    window.open(S.cfg.mpLink, '_blank');
    showOrderSuccess(orderId, total);
  }
}

/* ==========================================================================
   CUSTOMER ORDER HISTORY & TRACKER
   ========================================================================== */
function cancelOrder(id) {
  const o = S.orders.find(x => x.id === id);
  if(!o) return;
  if(o.status !== 'Pendiente') return toast('Solo puedes cancelar pedidos pendientes');
  if(confirm(`¿Deseas cancelar el pedido #${id}?`)) {
    o.status = 'Cancelado';
    // Restore stock
    o.items.forEach(it => {
      const p = S.prods.find(x => x.id === it.id);
      if(p) p.stock += it.q;
    });
    save();
    render();
    openOrderTracker();
    toast('Pedido cancelado');
  }
}

function openOrderTracker() {
  const q = ($('ord_q') ? $('ord_q').value : '').toLowerCase().trim();
  const st = $('ord_st') ? $('ord_st').value : '';

  let list = S.orders.filter(o => {
    const matchQ = !q || o.id.toLowerCase().includes(q) || (o.customer && o.customer.name.toLowerCase().includes(q));
    const matchSt = !st || o.status === st;
    return matchQ && matchSt;
  });

  const statuses = ['Pendiente', 'En preparación', 'Enviado', 'Entregado'];

  showOv(`

      <h3 class="sheet-title">Mis Pedidos Realizados</h3>
      <button class="ib" onclick="closeOv()">${ICONS.close}</button>

          <option value="">Todos</option>

          <option value="Entregado" ${st==='Entregado'?'selected':''}>Entregados</option>
          <option value="Cancelado" ${st==='Cancelado'?'selected':''}>Cancelados</option>
        </select>
      </div>

      ${list.length === 0 ? '<div class="empty">No se encontraron pedidos.</div>' : ''}
      ${list.map(o => {
        const curIdx = statuses.indexOf(o.status);
        return `

                ${statuses.map((s, idx) => `
                  <div style="z-index:2; text-align:center;">
                    <div style="width:18px; height:18px; border-radius:50%; background:${idx <= curIdx ? 'var(--pu)' : 'var(--bg-modal)'}; border:2px solid ${idx <= curIdx ? 'var(--pu)' : 'var(--border)'}; margin:0 auto; display:grid; place-items:center; font-size:9px; color:#fff; font-weight:700;">
                      ${idx <= curIdx ? '✓' : idx+1}
                    </div>
                    <div style="font-size:8px; color:${idx <= curIdx ? 'var(--tx)' : 'var(--tx-mut)'}; margin-top:2px;">${s}</div>
                  </div>
                `).join('')}
              </div>
            ` : ''}

            <div style="font-size:11px; color:var(--tx-mut); border-top:1px dashed var(--border); padding-top:6px; margin-top:6px;">
              ${o.items.map(i => `<div>• ${esc(i.name)} ×${i.q}</div>`).join('')}
              ${o.customer && o.customer.notes ? `<div style="font-style:italic; margin-top:2px;">Nota: ${esc(o.customer.notes)}</div>` : ''}
            </div>

            <div style="margin-top:6px; display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:12px;">
              <span>Total: <span class="price">${fmt(o.total)}</span></span>
              ${o.status === 'Pendiente' ? `<button class="btn danger sm" style="padding:2px 6px; font-size:10px;" onclick="cancelOrder('${o.id}')">Cancelar</button>` : ''}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `);
}

/* ==========================================================================
   ADMIN CONTROL PANEL & MANAGEMENT
   ========================================================================== */
function adminLogin() {
  if(isAdm) return adminPanel();
  const p = prompt('Contraseña de Administrador:');
  if(p === null) return;
  if(p === S.cfg.pass) {
    isAdm = true;
    adminPanel();
    toast('Sesión de administración iniciada');
  } else {
    toast('Contraseña incorrecta');
  }
}

function updateOrderStatus(orderId, newStatus) {
  const o = S.orders.find(x => x.id === orderId);
  if(o) {
    o.status = newStatus;
    save();
    toast(`Pedido #${orderId} actualizado a "${newStatus}"`);
    adminPanel();
  }
}

function generateRandomCoupon() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let code = 'OFF-';
  for(let i=0; i<5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
  const discount = Math.floor(Math.random() * 4 + 1) * 5; // 5%, 10%, 15%, 20%
  S.coupons.push({ code, discount, type: 'percent', active: true });
  save();
  adminPanel();
  toast(`Cupón ${code} (-${discount}%) generado ✨`);
}

function adminPanel() {
  const c = S.cfg;
  const totalSales = S.orders.filter(o => o.status !== 'Cancelado').reduce((s, o) => s + o.total, 0);
  const avgOrder = S.orders.length ? Math.round(totalSales / S.orders.length) : 0;
  const lowStockCount = S.prods.filter(p => p.stock <= 2).length;

  // Best sellers computation
  const itemCounts = {};
  S.orders.forEach(o => {
    if(o.status !== 'Cancelado') {
      (o.items||[]).forEach(i => {
        itemCounts[i.name] = (itemCounts[i.name] || 0) + i.q;
      });
    }
  });
  const bestSeller = Object.entries(itemCounts).sort((a,b)=>b[1]-a[1])[0];

  showOv(`
    <div class="sheet-header">
      <h3 class="sheet-title">Panel de Control Admin</h3>
      <button class="ib" onclick="closeOv()">${ICONS.close}</button>
    </div>
    <div class="pad">
      <!-- Admin Analytics Dashboard -->
      <div class="admin-grid">
        <div class="stat-card">
          <div class="val">${fmt(totalSales)}</div>
          <div class="lbl">Ventas Totales</div>
        </div>
        <div class="stat-card">
          <div class="val">${fmt(avgOrder)}</div>
          <div class="lbl">Ticket Promedio</div>
        </div>
        <div class="stat-card">
          <div class="val">${S.orders.length}</div>
          <div class="lbl">Pedidos</div>
        </div>
        <div class="stat-card">
          <div class="val" style="color:${lowStockCount > 0 ? 'var(--danger)' : 'var(--success)'}">${lowStockCount}</div>
          <div class="lbl">Bajo Stock</div>
        </div>
      </div>
      ${bestSeller ? `<div style="font-size:11px; color:var(--tx-mut); margin-bottom:10px; font-weight:600;">🔥 Producto Más Vendido: <b>${esc(bestSeller[0])}</b> (${bestSeller[1]} un.)</div>` : ''}

      <button class="btn" onclick="editP()">${ICONS.plus} Crear Nuevo Producto</button>

      <!-- Live Order Management Accordion -->
      <div class="acc glass" style="margin-top:12px;">
        <button onclick="acc(this)">📦 Gestión de Pedidos (${S.orders.length}) <span class="arrow">⌄</span></button>
        <div class="body">
          <div style="max-height:200px; overflow-y:auto;">
            ${S.orders.length === 0 ? '<div class="empty">No hay pedidos registrados</div>' : ''}
            ${S.orders.map(o => `
              <div class="row" style="font-size:11px;">
                <div>
                  <b>#${o.id}</b> - ${esc(o.customer?.name || 'Cliente')} (${fmt(o.total)})
                  <div style="color:var(--tx-mut);">${o.date}</div>
                </div>
                <select onchange="updateOrderStatus('${o.id}', this.value)" style="width:110px; padding:2px 4px; font-size:10px;">
                  <option value="Pendiente" ${o.status==='Pendiente'?'selected':''}>Pendiente</option>
                  <option value="En preparación" ${o.status==='En preparación'?'selected':''}>En Prep.</option>
                  <option value="Enviado" ${o.status==='Enviado'?'selected':''}>Enviado</option>
                  <option value="Entregado" ${o.status==='Entregado'?'selected':''}>Entregado</option>
                  <option value="Cancelado" ${o.status==='Cancelado'?'selected':''}>Cancelado</option>
                </select>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <!-- Products Management -->
      <h4 style="margin:14px 0 6px; font-size:12px;">Gestión de Productos (${S.prods.length})</h4>
      <div style="max-height:180px; overflow-y:auto; border:1px solid var(--border); border-radius:var(--radius-md); padding:6px;">
        ${S.prods.map(p => `
          <div class="row" style="padding:4px 0;">
            <div style="display:flex; align-items:center; gap:6px;">
              <div style="width:28px; height:28px; border-radius:var(--radius-sm); background:url('${p.img}') center/cover;"></div>
              <div>
                <b style="font-size:11px;">${esc(p.name)}</b>
                <div style="font-size:10px; color:var(--tx-mut);">${fmt(p.price)} · Stock: ${p.stock}</div>
              </div>
            </div>
            <div style="display:flex; gap:4px;">
              <button class="ib" style="width:26px; height:26px;" onclick="editP(${p.id})">${ICONS.edit}</button>
              <button class="ib" style="width:26px; height:26px; color:var(--danger);" onclick="delP(${p.id})">${ICONS.trash}</button>
            </div>
          </div>
        `).join('')}
      </div>

      <!-- Settings Accordion -->
      <div class="acc glass" style="margin-top:10px;">
        <button onclick="acc(this)">⚙️ Configuración de Tienda y Pagos <span class="arrow">⌄</span></button>
        <div class="body">
          <label>Nombre de la Tienda</label>
          <input id="c_name" value="${esc(c.name)}">
          <label>Teléfono de Contacto</label>
          <input id="c_phone" value="${esc(c.phone)}">
          <label>WhatsApp Comercial</label>
          <input id="c_whats" value="${esc(c.whats)}">
          <label>Instagram Username</label>
          <input id="c_insta" value="${esc(c.insta)}">
          <label>Símbolo de Moneda</label>
          <input id="c_cur" value="${esc(c.cur)}">
          <label>CBU Bancario</label>
          <input id="c_cbu" value="${esc(c.cbu)}">
          <label>Alias CBU</label>
          <input id="c_alias" value="${esc(c.alias)}">
          <label>Link de Pago Mercado Pago (Opcional)</label>
          <input id="c_mpl" value="${esc(c.mpLink)}">
          <label>Contraseña de Administrador</label>
          <input id="c_pass" value="${esc(c.pass)}">
          <button class="btn sm" style="margin-top:10px;" onclick="saveCfg()">Guardar Ajustes</button>
        </div>
      </div>

      <!-- Coupons Accordion -->
      <div class="acc glass" style="margin-top:8px;">
        <button onclick="acc(this)">🎟️ Gestión de Cupones de Descuento <span class="arrow">⌄</span></button>
        <div class="body">
          <button class="btn sec sm" style="margin-bottom:8px;" onclick="generateRandomCoupon()">⚡ Generar Cupón Aleatorio</button>
          ${S.coupons.map((cp, idx) => `
            <div class="row">
              <div><b>${cp.code}</b> (${cp.type === 'percent' ? cp.discount + '%' : fmt(cp.discount)})</div>
              <button class="btn danger sm" style="padding:2px 6px; font-size:10px;" onclick="delCoupon(${idx})">Eliminar</button>
            </div>
          `).join('')}
          <div style="border-top:1px dashed var(--border); margin-top:8px; padding-top:8px;">
            <label>Nuevo Código</label>
            <input id="cp_new_code" placeholder="Ej: VERANO2025">
            <label>Monto o Porcentaje</label>
            <input id="cp_new_val" type="number" placeholder="Ej: 15">
            <label>Tipo de Descuento</label>
            <select id="cp_new_type">
              <option value="percent">Porcentaje (%)</option>
              <option value="fixed">Monto Fijo ($)</option>
            </select>
            <button class="btn sm" style="margin-top:8px;" onclick="addCoupon()">Crear Cupón</button>
          </div>
        </div>
      </div>

      <!-- Backup / Restore Section -->
      <div style="display:flex; gap:6px; margin-top:14px;">
        <button class="btn sec sm" style="flex:1;" onclick="expo()">⬇ Backup JSON</button>
        <button class="btn sec sm" style="flex:1;" onclick="$('imp').click()">⬆ Restaurar JSON</button>
        <button class="btn danger sm" onclick="isAdm=false; closeOv(); toast('Sesión cerrada');">Salir</button>
      </div>
      <input type="file" id="imp" accept=".json" hidden onchange="impo(this)">
    </div>
  `);
}

function saveCfg() {
  const g = id => $(id).value.trim();
  Object.assign(S.cfg, {
    name: g('c_name') || 'ProStore Digital',
    phone: g('c_phone'),
    whats: g('c_whats'),
    insta: g('c_insta'),
    cur: g('c_cur') || '$',
    cbu: g('c_cbu'),
    alias: g('c_alias'),
    mpLink: g('c_mpl'),
    pass: g('c_pass') || '1234'
  });
  save();
  render();
  toast('Configuración guardada ✅');
}

function addCoupon() {
  const code = $('cp_new_code').value.trim().toUpperCase();
  const discount = +$('cp_new_val').value;
  const type = $('cp_new_type').value;

  if(!code || !discount) return toast('Completa los campos del cupón');
  S.coupons.push({ code, discount, type, active: true });
  save();
  adminPanel();
  toast('Cupón creado con éxito ✨');
}

function delCoupon(idx) {
  S.coupons.splice(idx, 1);
  save();
  adminPanel();
  toast('Cupón eliminado');
}

let tmpImg = '';
function editP(id) {
  const p = S.prods.find(x => x.id === id) || { name: '', price: '', cat: '', desc: '', cuotas: 6, stock: 10, tag: '', img: '' };
  tmpImg = p.img;

  showOv(`
    <div class="sheet-header">
      <h3 class="sheet-title">${id ? 'Editar Producto' : 'Nuevo Producto'}</h3>
      <button class="ib" onclick="adminPanel()">${ICONS.close}</button>
    </div>
    <div class="pad">
      <label>Imagen (Archivo o SVG Vector Generado)</label>
      <input type="file" accept="image/*" onchange="pimg(this)">
      <img id="pv" src="${p.img}" style="width:100px; height:100px; object-fit:cover; border-radius:var(--radius-md); margin-top:8px; ${p.img ? '' : 'display:none'}">

      <label>Nombre del Producto</label>
      <input id="p_n" value="${esc(p.name)}">
      <label>Precio</label>
      <input id="p_p" type="number" value="${p.price}">
      <label>Categoría</label>
      <input id="p_c" value="${esc(p.cat)}" placeholder="Audio, Relojes, Hogar...">
      <label>Etiqueta / Tag (Opcional)</label>
      <input id="p_t" value="${esc(p.tag)}" placeholder="Oferta, Nuevo, Más Vendido...">
      <label>Descripción</label>
      <textarea id="p_d" rows="3">${esc(p.desc)}</textarea>
      <label>Stock Disponible</label>
      <input id="p_s" type="number" value="${p.stock}">

      <button class="btn" style="margin-top:16px;" onclick="saveP(${id || 0})">Guardar Producto</button>
    </div>
  `);
}

function pimg(i) {
  const f = i.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, 800 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = im.width * s;
      c.height = im.height * s;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      tmpImg = c.toDataURL('image/jpeg', 0.82);
      $('pv').src = tmpImg;
      $('pv').style.display = 'block';
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
}

function saveP(id) {
  const n = $('p_n').value.trim();
  const p = +$('p_p').value;
  if(!n || !p) return toast('Completa nombre y precio');

  const obj = {
    name: n,
    price: p,
    cat: $('p_c').value.trim() || 'General',
    tag: $('p_t').value.trim(),
    desc: $('p_d').value.trim(),
    cuotas: 6,
    stock: +$('p_s').value || 0,
    img: tmpImg || svgIllustration('#ec4899', '#8b5cf6', 'audio'),
    rating: 5.0,
    reviews: []
  };

  if(id) {
    const existing = S.prods.find(x => x.id === id);
    Object.assign(existing, obj);
  } else {
    S.prods.push({ id: Date.now(), ...obj });
  }

  save();
  render();
  adminPanel();
  toast('Producto guardado con éxito ✅');
}

function delP(id) {
  if(confirm('¿Seguro que deseas eliminar este producto?')) {
    S.prods = S.prods.filter(p => p.id !== id);
    save();
    render();
    adminPanel();
    toast('Producto eliminado');
  }
}

function expo() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type: 'application/json'}));
  a.download = 'prostore-backup.json';
  a.click();
}

function impo(i) {
  const r = new FileReader();
  r.onload = () => {
    try {
      S = JSON.parse(r.result);
      save();
      render();
      adminPanel();
      toast('Datos importados con éxito ✅');
    } catch {
      toast('Archivo JSON inválido');
    }
  };
  r.readAsText(i.files[0]);
}

/* Helper sheet triggers */
function showOv(h) {
  $('sh').innerHTML = h;
  $('ov').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeOv() {
  $('ov').classList.remove('show');
  document.body.style.overflow = '';
  if(window.location.hash.startsWith('#prod-')) {
    history.replaceState(null, null, ' ');
  }
}

function checkDeepLink() {
  const hash = window.location.hash;
  if(hash && hash.startsWith('#prod-')) {
    const id = +hash.replace('#prod-', '');
    if(id) openP(id);
  }
}
window.addEventListener('hashchange', checkDeepLink);
function acc(el) {
  el.parentElement.classList.toggle('open');
}

/* Keyboard Shortcuts */
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeOv();
  } else if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault();
    const q = $('q');
    if(q) q.focus();
  } else if (e.altKey && e.key.toLowerCase() === 'c') {
    e.preventDefault();
    openCart();
  }
});

// Initial Boot
initIcons();
render();
checkDeepLink();
</script>
